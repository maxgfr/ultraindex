name: Engine re-pin

# Daily check for a newer maxgfr/codeindex release. If the vendored engine is
# already current, this is a no-op green run. Otherwise it re-pins, runs the
# exact same gates as ci.yml, and either:
#   - pushes straight to main + explicitly triggers release.yml/ci.yml
#     (a push authenticated with GITHUB_TOKEN does NOT itself trigger other
#     workflows — that's why steps below call `gh workflow run` explicitly), or
#   - on any gate failure, pushes nothing and opens no PR — the run just
#     fails and the next daily cron retries. A red run is the signal to
#     investigate locally.
on:
  schedule:
    - cron: "38 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write

concurrency: engine-repin

jobs:
  repin:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Driven by `sync-engine.mjs --list` rather than by a copy of the engine
      # table kept here: adding an engine to the script is then the only edit
      # needed, and the automation cannot drift from the list it is watching.
      - name: Re-pin every engine that has a newer release
        id: detect
        run: |
          set -euo pipefail
          SUMMARY=""
          while read -r NAME REPO PINNED; do
            # NOT releases/latest: a repo may also publish non-engine asset
            # releases (codeindex publishes embed-model-v1), which are not tags
            # this can pin to.
            LATEST=$(gh api "repos/${REPO}/releases" --jq '[.[] | select(.tag_name | test("^v[0-9]")) | .tag_name] | first')
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              echo "::error::could not determine the latest ${NAME} release tag"
              exit 1
            fi
            if [ "$PINNED" = "$LATEST" ]; then
              echo "${NAME}: up to date (${PINNED})"
              continue
            fi
            echo "${NAME}: ${PINNED} -> ${LATEST}"
            node scripts/sync-engine.mjs --engine "$NAME" --ref "$LATEST"
            SUMMARY="${SUMMARY}${NAME} ${PINNED} -> ${LATEST}"$'\n'
          done < <(node scripts/sync-engine.mjs --list)

          if [ -z "$SUMMARY" ]; then
            echo "repin=false" >> "$GITHUB_OUTPUT"
          else
            echo "repin=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              printf '%s' "$SUMMARY"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the vendored engines match their new pins
        if: steps.detect.outputs.repin == 'true'
        run: node scripts/sync-engine.mjs --check

      - name: Install dependencies
        if: steps.detect.outputs.repin == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run typecheck

      - name: Rebuild bundle for the new pin + stage outputs
        if: steps.detect.outputs.repin == 'true'
        # check:build's own tsup+diff would otherwise fail on the very fact
        # that the rebuilt bundle isn't committed yet. Build once here and
        # stage everything (vendor pin + bundle + skill mirror) so the index
        # already matches the working tree before that gate runs.
        run: |
          pnpm run build
          git add -A

      - name: Build is reproducible (committed bundle up to date)
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run check:build

      - name: Test
        if: steps.detect.outputs.repin == 'true'
        run: |
          pnpm test 2>&1 | tee test-output.log
          { grep -E "Test Files|Tests " test-output.log || true; } > "$RUNNER_TEMP/test-summary.txt"

      - name: Smoke-run the committed bundle (offline, fixture repo)
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run demo

      - name: Assert the index was produced
        if: steps.detect.outputs.repin == 'true'
        run: test -f /tmp/ultraindex-demo/INDEX.md && test -f /tmp/ultraindex-demo/graph.json

      - name: Push re-pin to main
        if: success() && steps.detect.outputs.repin == 'true'
        id: push
        env:
          ENGINES: ${{ steps.detect.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/vendor/engine.meta.json src/vendor/codeindex-engine.mjs src/vendor/codeindex-engine.d.mts \
            scripts/ultraindex.mjs skills/ultraindex/scripts/ultraindex.mjs
          TEST_SUMMARY=$(cat "$RUNNER_TEMP/test-summary.txt" 2>/dev/null || echo "test summary unavailable")
          {
            echo "feat(engine): re-pin vendored engines"
            echo
            echo "automated re-pin, all gates green, goldens byte-identical"
            echo
            printf '%s' "${ENGINES}"
            echo "typecheck: clean"
            echo "check:build: bundle rebuilt, diff clean against HEAD (2 tracked build paths)"
            echo "${TEST_SUMMARY}"
            echo "demo: index built + checked (tests/fixtures/mini-repo)"
          } > commit-message.txt
          git commit -F commit-message.txt
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger release + ci workflows
        if: success() && steps.detect.outputs.repin == 'true'
        # A push authenticated with the default GITHUB_TOKEN does not fire
        # other workflows' `on: push` triggers — must dispatch explicitly.
        run: |
          gh workflow run release.yml --ref main
          gh workflow run ci.yml --ref main

      # A red re-pin means this repo has stopped following the engine. Nothing
      # used to carry that signal out of the Actions tab, so ultrasec failed
      # three nights running in August before a human noticed. One open issue per
      # repo, a comment on each further failure, closed by the first green run.
      - name: Report the failure on the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create engine-repin --color B60205 --description "This automated pin needs a human" --force >/dev/null 2>&1 || true
          NUM=$(gh issue list --state open --label engine-repin --limit 1 --json number --jq '.[0].number // empty')
          # Built with printf rather than a multi-line literal: this file's own
          # indentation would otherwise be carried into the body and render the
          # whole message as a code block.
          BODY=$(printf '%s\n\n%s\n' \
            "The daily engine-repin run failed: ${RUN}" \
            "Nothing was pushed, so main is not broken — the pin is simply frozen where it was, and this repo stays behind the engine until someone looks.")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "${{ github.workflow }} is failing" --label engine-repin --body "$BODY"
          fi

      - name: Close the tracking issue once a run is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --state open --label engine-repin --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then exit 0; fi
          gh issue close "$NUM" --comment "Green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
